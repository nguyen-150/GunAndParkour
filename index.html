<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Gun and PARKOUR</title>
  <style>
        /* Full-size page with no margins; the canvas is centered inside it */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111111;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scale the canvas to fit the window while keeping the 3:2 ratio (960x640).
       Logical drawing size stays 960x640; only the displayed size changes. */
    #game {
      display: block;
      background: #1c1f2b;
      cursor: crosshair; /* aiming cursor */
      aspect-ratio: 3 / 2;
      width: min(100vw, 150vh); /* 150vh = 1.5 * viewport height */
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="640"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
