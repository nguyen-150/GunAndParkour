<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Gun and PARKOUR</title>
  <style>
        /* Full-size page with no margins; the canvas is centered inside it */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111111;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
     /* Displayed size is set by resizeCanvas() in src/main.js,
     so it fits the window without stretching. */
    #game {
      display: block;
      background: #1c1f2b;
      cursor: crosshair; /* aiming cursor */
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="640"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
